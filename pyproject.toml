[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-library"
version = "0.1.0"
description = "Subject-agnostic quiz core: paragraph text from textbook digests + LLM question generation"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
include = ["quiz_library*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]